name: Verify Neslos
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Build private-runtime image
        run: docker build --platform linux/amd64 -f deploy/tee/Dockerfile -t neslos-tee:ci .
      - name: Reject fake hardware in the restricted runtime
        run: >-
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges
          --network none --tmpfs /tmp:rw,noexec,nosuid,size=64m
          --mount "type=bind,source=${{ github.workspace }}/tests/tee-container.mjs,target=/tmp/tee-container.mjs,readonly"
          neslos-tee:ci node /tmp/tee-container.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-evidence
          path: |
            artifacts/
            test-results/
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/policy-vault
      - name: Install cargo-near system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev pkg-config
      - run: cargo install cargo-near --version 0.22.0 --locked
      - run: npm run test:contract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-evidence
          path: artifacts/
