[package]
name = "neslos-commerce-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
description = "Sandbox-only FT and Rhea behavior fixture, not a production protocol"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
near-sdk = "=5.29.0"
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
